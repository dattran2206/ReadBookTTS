name: Wordwave Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Loại bản dựng'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'apk'
          - 'aab'

jobs:
  build-release:
    name: Build Release Package
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        if: ${{ github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'apk' || startsWith(github.ref, 'refs/tags/v') }}
        run: ./gradlew assembleRelease

      - name: Build Release Android App Bundle (AAB)
        if: ${{ github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'aab' || startsWith(github.ref, 'refs/tags/v') }}
        run: ./gradlew bundleRelease

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wordwave-release-packages
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 30

      - name: Create GitHub Release (On Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
