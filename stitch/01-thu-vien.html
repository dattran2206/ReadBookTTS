<!-- Interactive State & Store Engine -->
<script>
    // Central Playback Store
    const playbackStore = {
      id: "demen",
      title: "Dế Mèn Phiêu Lưu Ký",
      author: "Tô Hoài",
      chapter: "Chương 3: Thoát khỏi tay hai đứa trẻ",
      progress: 48,
      currentTime: "12:45",
      totalTime: "26:30",
      remaining: "Còn 14 phút",
      voice: "NSƯT Mai Lan",
      isPlaying: true
    };

    const playerTitle = document.getElementById("player-title");
    const playerSub = document.getElementById("player-sub");
    const playerIcon = document.getElementById("player-icon");
    const playerProgress = document.getElementById("player-progress-bar");
    const playerToggle = document.getElementById("player-toggle");
    const miniPlayer = document.getElementById("mini-player");

    function updateMiniPlayerUI() {
      playerTitle.innerHTML = `${playbackStore.title} <span class="font-normal text-on-surface-variant">• ${playbackStore.chapter.split(':')[0]}</span>`;
      playerSub.textContent = `Giọng ${playbackStore.voice} • ${playbackStore.remaining}`;
      playerProgress.style.width = playbackStore.progress + "%";
      playerIcon.textContent = playbackStore.isPlaying ? "pause" : "play_arrow";
    }

    // Toggle Play/Pause on button
    playerToggle.addEventListener("click", (e) => {
      e.stopPropagation();
      playbackStore.isPlaying = !playbackStore.isPlaying;
      updateMiniPlayerUI();
    });

    // Clicking Mini Player simulated navigation
    miniPlayer.addEventListener("click", () => {
      // Simulate navigate to Player view
      const activeTabBtn = document.querySelector('[data-tab="now-playing"]');
      if (activeTabBtn) activeTabBtn.click();
    });

    // Clicking Book Card updates central store & switches to it
    document.querySelectorAll(".book-card").forEach(card => {
      card.addEventListener("click", () => {
        playbackStore.id = card.dataset.id;
        playbackStore.title = card.dataset.title;
        playbackStore.author = card.dataset.author;
        playbackStore.chapter = card.dataset.chapter;
        playbackStore.progress = parseInt(card.dataset.progress, 10);
        playbackStore.remaining = card.dataset.remaining;
        playbackStore.voice = card.dataset.voice;
        playbackStore.isPlaying = true;
        updateMiniPlayerUI();
      });
    });

    // Filter Chips Interactive UI
    document.querySelectorAll(".filter-chip").forEach(chip => {
      chip.addEventListener("click", () => {
        document.querySelectorAll(".filter-chip").forEach(c => {
          c.classList.remove("bg-primary-container", "text-on-primary", "shadow-sm");
          c.classList.add("bg-surface-container", "text-on-surface-variant");
        });
        chip.classList.remove("bg-surface-container", "text-on-surface-variant");
        chip.classList.add("bg-primary-container", "text-on-primary", "shadow-sm");
      });
    });

    // Bottom Navigation Tabs Interactive State
    document.querySelectorAll(".tab-item").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab-item").forEach(t => {
          t.classList.remove("text-primary-container");
          t.classList.add("text-on-surface-variant");
          const div = t.querySelector("div");
          if (div) div.className = "w-12 h-7 rounded-full flex items-center justify-center text-on-surface-variant mb-0.5";
          const icon = t.querySelector(".material-symbols-outlined");
          if (icon) icon.style.fontVariationSettings = "'FILL' 0";
          const span = t.querySelector("span.text-\\[11px\\]");
          if (span) span.className = "text-[11px] font-normal";
        });

        tab.classList.remove("text-on-surface-variant");
        tab.classList.add("text-primary-container");
        const div = tab.querySelector("div");
        if (div) div.className = "w-12 h-7 rounded-full flex items-center justify-center bg-primary-container/15 text-primary-container mb-0.5";
        const icon = tab.querySelector(".material-symbols-outlined");
        if (icon) icon.style.fontVariationSettings = "'FILL' 1";
        const span = tab.querySelector("span.text-\\[11px\\]");
        if (span) span.className = "text-[11px] font-medium";
      });
    });

    // File Import trigger simulation
    const handleImport = () => {
      const fileInput = document.createElement("input");
      fileInput.type = "file";
      fileInput.accept = ".epub";
      fileInput.onchange = () => {
        if (fileInput.files.length) {
          alert(`Đã nhận tệp: ${fileInput.files[0].name}. Tự động phân tích mục lục...`);
        }
      };
      fileInput.click();
    };

    document.getElementById("import-btn")?.addEventListener("click", handleImport);
    document.getElementById("import-btn-sec")?.addEventListener("click", handleImport);

    // Initial render
    updateMiniPlayerUI();
  </script>
